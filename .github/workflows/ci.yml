name: CI Checks
on: [push, pull_request] # The events that trigger the runner

jobs:
  test:
    runs-on: ubuntu-latest # The virtual machine type
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Essential step to pull your code into the runner

      - name: Setup Node.js # Example: setting up an environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Test
        run: |
          npm install
          npm test

      - name: Publish Playwright Report
        uses: daun/playwright-report-summary@v1
        if: always() # Run even if tests fail
        with:
          report-file: results.json
          comment-title: 'Playwright Test Results'

      - name: Upload Backend Coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # Get this from codecov.io
          files: ./coverage/lcov.info # Jest default output
          flags: backend

      - name: Upload Frontend Coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-frontend/lcov.info # Output from your generate-coverage.js
          flags: frontend